<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YDY">
<title>YDY スタッフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2efe8; --surface:#fbf9f5; --surface2:#ebe6db; --line:#d8d0bf;
  --text:#221e17; --muted:#7a705e; --gold:#9c7a33; --gold-ink:#fff8e8; --gold-soft:rgba(156,122,51,.12);
  --danger:#b24a3b; --ok:#4f7a4a;
  --k-meet:#5b7fb0; --k-study:#9c7a33; --k-off:#b24a3b; --k-event:#7c5ba8; --k-other:#7a705e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1f1c16; --surface2:#29251d; --line:#3a342a;
    --text:#efe8da; --muted:#9a917f; --gold:#cfa95e; --gold-ink:#1b170f; --gold-soft:rgba(207,169,94,.14);
    --danger:#e07563; --ok:#86b07c;
    --k-meet:#7ea3d6; --k-study:#cfa95e; --k-off:#e07563; --k-event:#a988d4; --k-other:#9a917f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1f1c16; --surface2:#29251d; --line:#3a342a;
  --text:#efe8da; --muted:#9a917f; --gold:#cfa95e; --gold-ink:#1b170f; --gold-soft:rgba(207,169,94,.14);
  --danger:#e07563; --ok:#86b07c;
  --k-meet:#7ea3d6; --k-study:#cfa95e; --k-off:#e07563; --k-event:#a988d4; --k-other:#9a917f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.min{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn[hidden]{display:none}
.plain{border:0;background:none}
.top h1{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:.02em}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

main{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* hero */
.hero{margin:0 -16px;padding:34px 20px 22px;background:#000;color:#f2ede3;text-align:center}
.hero .logo{display:block;width:min(52vw,220px);height:auto;margin:0 auto}
.wordmark{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:64px;line-height:.9;letter-spacing:.06em;margin:0;color:var(--gold)}
.hero .date{margin-top:18px;color:#a8a090;font-size:14px}
.hero .greet{font-size:15px;margin-top:2px}

.notice-pin{margin:16px 0 0;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--gold-soft);border-radius:12px;padding:12px 14px;display:block;width:100%;text-align:left}
.notice-pin b{color:var(--gold);margin-right:6px}
.notice-pin .t{font-weight:700}
.notice-pin .s{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

h2.sec{font-size:15px;font-weight:700;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec a,h2.sec button{font-size:13px;font-weight:500;color:var(--gold);background:none;border:0;padding:0}

/* today strip */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.storecell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.storecell{position:relative;overflow:hidden;isolation:isolate}
.storecell.haslogo::before{content:"";position:absolute;inset:5px;z-index:-1;background:var(--text);opacity:.28;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.storecell .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storecell .v{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;margin-top:2px}
.storecell .pending{font-size:13px;color:var(--muted);margin-top:4px}
.storecell.done{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.todaytotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:0 2px;color:var(--muted);font-size:13px}
.todaytotal strong{font-family:"Shippori Mincho B1",serif;font-size:22px;color:var(--text)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meta img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--surface2)}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:var(--gold-soft)}
.sale-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sale-date{font-weight:700;font-size:14px}
.sale-total{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:28px;line-height:1.1;margin:6px 0 10px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.kv div{font-size:11px;color:var(--muted)}
.kv b{display:block;font-size:15px;color:var(--text);font-weight:700}
.memo{margin-top:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.act{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.act[aria-pressed="true"]{color:var(--gold);font-weight:700}
.act.danger{color:var(--danger);margin-left:auto}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.summary .big{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:34px;line-height:1.1}
.summary .lab{font-size:12px;color:var(--muted)}
.bars{margin-top:14px;display:grid;gap:10px}
.bar .row{display:flex;justify-content:space-between;font-size:13px}
.bar .track{height:6px;background:var(--surface2);border-radius:3px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--gold);border-radius:3px}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.monthnav .m{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px}

.notice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.notice.unread::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--gold)}
.notice .t{font-weight:700;font-size:15px;margin:6px 0 2px}
.notice .b{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.notice .foot{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.cal .wk,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wk div{font-size:11px;color:var(--muted);padding:4px 0}
.cal .wk div:first-child{color:var(--danger)}
.cal .wk div:last-child{color:var(--k-meet)}
.day{border:0;background:none;padding:6px 0 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.day .d{font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.day.out .d{color:var(--muted);opacity:.45}
.day.today .d{border:1px solid var(--gold);color:var(--gold);font-weight:700}
.day[aria-selected="true"] .d{background:var(--gold);color:var(--gold-ink);font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:8px}
.ev .bar2{width:4px;align-self:stretch;border-radius:2px}
.ev .time{font-size:12px;color:var(--muted);min-width:78px}
.ev .t{font-weight:700}
.ev .x{margin-left:auto}
.k-meet{background:var(--k-meet)} .k-study{background:var(--k-study)} .k-off{background:var(--k-off)} .k-event{background:var(--k-event)} .k-other{background:var(--k-other)}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
.empty button{margin-top:10px}

/* bottom nav + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold);font-weight:700}
.tabs .badge{top:4px;right:calc(50% - 22px)}
.badge[hidden]{display:none}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mchips .chip{padding:6px 12px}
.tag.me{background:var(--danger);border-color:var(--danger);color:#fff}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;height:40px;border-radius:20px;border:0;background:var(--gold);color:var(--gold-ink);
  font-weight:700;padding:0 14px 0 11px;font-size:13px;display:flex;align-items:center;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab svg{width:16px;height:16px}
.fab[hidden]{display:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);z-index:41;background:var(--surface);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .25s ease;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .who{display:flex;gap:10px;align-items:center;padding:6px 4px 16px;border-bottom:1px solid var(--line)}
.drawer .who img{width:40px;height:40px;border-radius:50%}
.drawer nav{display:grid;gap:2px;padding:12px 0}
.drawer nav button{border:0;background:none;text-align:left;padding:11px 8px;border-radius:10px;font-size:15px}
.drawer nav button[aria-current="page"]{color:var(--gold);font-weight:700;background:var(--gold-soft)}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
.scrim.s{z-index:50}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
label.f span{display:block;margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--text)}
textarea.in{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2 .in{min-width:0}
input[type=date].in,input[type=time].in{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
.sumline{display:flex;justify-content:space-between;align-items:baseline;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--gold-soft);border-radius:12px;padding:10px 14px;margin:-2px 0 14px;font-size:13px;color:var(--muted)}
.sumline strong{font-family:"Shippori Mincho B1",serif;font-size:24px;color:var(--text)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--gold);color:var(--gold-ink);width:100%}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.paste{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:var(--bg)}
.paste summary{font-size:14px;cursor:pointer;color:var(--gold);font-weight:700}
.namegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.namebtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 8px;font-size:15px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px}
.namebtn small{font-size:11px;color:var(--muted)}
.namebtn:disabled{opacity:.45}
.namebtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--gold);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:14px -16px 0}
.pcell{border:0;padding:0;aspect-ratio:1;background:var(--surface2);overflow:hidden}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pview{margin:0 -18px;background:#000;display:flex;justify-content:center}
.pview img{max-width:100%;max-height:62vh;object-fit:contain;display:block}
.pcell.ba{display:grid;grid-template-columns:1fr 1fr;gap:1px;position:relative}
.pcell.ba img{height:100%}
.balab{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px}
.pview.ba{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.pview.ba figure{margin:0;position:relative;display:flex;align-items:center;justify-content:center}
.pview.ba img{max-height:58vh;width:100%;object-fit:contain}
.pview.ba figcaption{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 8px}
.bapick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bapick button{aspect-ratio:3/4;border:1px dashed var(--line);background:var(--bg);border-radius:12px;padding:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold);font-weight:700}
.bapick button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bapick button img+span{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:12px;padding:3px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .in{min-width:0}
.mhead{font-weight:700;font-size:14px;margin:6px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.mrow{display:flex;gap:10px;align-items:baseline;margin-top:8px;font-size:14px}
.mrow>span{min-width:64px;color:var(--muted);font-size:13px}
.mblock{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.mgrid b{display:block;font-size:16px;color:var(--text)}
.mtext{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mtext .lab{font-size:12px;color:var(--muted);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.detail-body{white-space:pre-wrap;word-break:break-word;font-size:15px;margin:10px 0 16px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.banner{margin-top:14px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.list-read{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="iconbtn plain" id="menuBtn" aria-label="メニューを開く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="iconbtn plain" id="backBtn" aria-label="前のページに戻る" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <h1 id="title">YDY</h1>
  <button class="iconbtn" id="bellBtn" aria-label="未読の業務連絡">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span class="badge" id="bellBadge" hidden></span>
  </button>
</header>

<main id="view"></main>

<button class="fab" id="fab" hidden></button>

<nav class="tabs" aria-label="メインメニュー">

const ALBUMS = [{id:'protes',name:'PROTES'},{id:'kaminavi',name:'髪NAVI'},{id:'other',name:'その他'}];
S.photos = []; S.album = 'protes'; S.monthly = []; S.salesMode = 'daily'; S.mUnit = 'all';
const units = () => [...S.stores, {id:'ses', name:'SES'}];
const unitName = id => units().find(u=>u.id===id)?.name || '';
const hashName = s => { let x=5381; for (const c of s) x=((x*33)^c.codePointAt(0))>>>0; return x.toString(36); };

const storeName = id => id==='all' ? '全店' : (S.stores.find(s=>s.id===id)?.name || '店舗');
const nameOf = id => S.members[id]?.displayName || S.profiles[id]?.name || 'スタッフ';
const avatarOf = id => S.profiles[id]?.avatarUrl || '';
const myStore = () => S.members[S.me.id]?.storeId || S.stores[0].id;
const isRead = n => n.authorId===S.me.id || S.reads.some(r => r.noticeId===n.id && r.uid===S.me.id);
const unreadCount = () => S.me.id ? S.notices.filter(n => !isRead(n)).length : 0;
const myName = () => S.members[S.me.id]?.displayName || '';
const mentionsMe = n => n.authorId!==S.me.id && !!S.me.id && ((n.mentions||[]).includes('All') || (!!myName() && (n.mentions||[]).includes(myName())));
const isMeTag = m => m==='All' || m===myName();
const myMentions = () => S.notices.filter(mentionsMe);
const unreadMentions = () => myMentions().filter(n=>!isRead(n)).length;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }


const TITLES = {home:'YDY', sales:'売上報告', notices:'業務連絡', calendar:'カレンダー', photos:'画像', monthly:'月別売上報告', settings:'設定'};
const hist = [];
function go(v, fromBack){ if (!fromBack && v!==S.view) { hist.push(S.view); if (hist.length>20) hist.shift(); } if (v==='home') hist.length=0; S.view=v; closeDrawer(); closeSheet(); render(); window.scrollTo({top:0}); }
function back(){ go(hist.pop() || 'home', true); }
$('#backBtn').onclick = back;
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('#menuBtn').onclick = () => { $('#drawer').classList.add('on'); $('#drawerScrim').classList.add('on'); };
$('#drawerScrim').onclick = closeDrawer;
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawerScrim').classList.remove('on'); }
$('#bellBtn').onclick = () => openMentions();


function openSheet(html, mount){
  const sh=$('#sheet'); sh.innerHTML='<div class="grab"></div>'+html;
  sh.classList.add('on'); $('#sheetScrim').classList.add('on');
  mount && mount(sh);
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetScrim').classList.remove('on'); }
$('#sheetScrim').onclick = closeSheet;


function render(){
  $('#title').textContent = TITLES[S.view];
  $('#backBtn').hidden = S.view==='home';
  $('#menuBtn').hidden = S.view!=='home';
  document.querySelectorAll('[data-go]').forEach(b => b.dataset.go===S.view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  const u = unreadCount();
  { const e=$('#tabBadge'); e.hidden=!u; e.textContent=u; }
  { const m=unreadMentions(), e=$('#bellBadge'); e.hidden=!m; e.textContent=m; }
  $('#meName').textContent = S.me.id ? nameOf(S.me.id) : 'ゲスト';
  $('#meStore').textContent = '';
  if (S.me.avatar) $('#meAvatar').src = S.me.avatar;

  const fab=$('#fab');
  const fabs = {home:['売上を報告',openSalesForm], sales:['売上を報告',openSalesForm], monthly:['月報を書く',()=>openMonthlyForm()], notices:['連絡を書く',openNoticeForm], calendar:['予定を追加',()=>openEventForm(S.calSel)], photos:['画像を追加',openPhotoForm]};
  const f = fabs[S.view];
  fab.hidden = !f || !S.me.canWrite || !db;
  if (f){ fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>${f[0]}`; fab.onclick=f[1]; }

  const v = $('#view');
  v.innerHTML = ({home:viewHome, sales:viewSales, notices:viewNotices, calendar:viewCalendar, photos:viewPhotos, monthly:viewMonthly, settings:viewSettings})[S.view]();
  bindView(v);
}

function statusBanner(){
  if (S.offline) return `<div class="banner">サーバーにつながりません。電波の良いところで開き直してください。</div>`;
  if (!S.ready) return `<div class="banner">読み込み中…</div>`;
  if (!S.me.id) return `<div class="banner">名前を選ぶと投稿できるようになります。</div>`;
  return '';
}

function viewHome(){
  const d = new Date();
  const todays = S.sales.filter(s => s.date===today);
  const pinned = S.notices.find(n => n.pinned);
  const upcoming = S.events.filter(e => e.date>=today).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))).slice(0,3);
  const latest = S.notices.slice(0,3);
  const hi = S.me.id && S.members[S.me.id] ? `${esc(nameOf(S.me.id))}さん、おつかれさまです` : '';
  return `
  <section class="hero">
    <img class="logo" src="${LOGO}" alt="YDY">
    <div class="date">${d.getFullYear()}年${jpDate(today)}</div>
    ${hi?`<div class="greet">${hi}</div>`:''}
  </section>
  ${statusBanner()}
  ${pinned?`<button class="notice-pin" data-notice="${esc(pinned.id)}"><div class="t"><b>📌 お知らせ</b>${esc(pinned.title)}</div><div class="s">${esc(pinned.body)}</div></button>`:''}

  <h2 class="sec">今日の売上 <button data-go2="sales">すべて見る</button></h2>
  <div class="stores">
    ${S.stores.map(st => { const r = todays.find(s=>s.storeId===st.id);
      return `<div class="storecell ${r?'done':''} ${STORE_LOGOS[st.id]?'haslogo':''}" style="${STORE_LOGOS[st.id]?`--logo:url(${STORE_LOGOS[st.id]})`:''}"><div class="n">${esc(st.name)}</div>${r?`<div class="v num">${yen(r.total)}</div>`:`<div class="pending">未報告</div>`}</div>`; }).join('')}
  </div>

  ${upcoming.length ? upcoming.map(evRow).join('') : `<div class="empty">予定はまだ入っていません。</div>`}

function viewSales(){
  return viewDaily();
}
function viewDaily(){
  const [y,m] = S.salesMonth.split('-').map(Number);
  const inMonth = S.sales.filter(s => s.date.startsWith(S.salesMonth));
  const list = inMonth.filter(s => S.salesStore==='all' || s.storeId===S.salesStore).sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const byStore = S.stores.map(st => ({st, sum: inMonth.filter(s=>s.storeId===st.id).reduce((a,s)=>a+(+s.total||0),0), cust: inMonth.filter(s=>s.storeId===st.id).reduce((a,s)=>a+(+s.customers||0),0)}));
  const monthSum = byStore.reduce((a,b)=>a+b.sum,0);
  const max = Math.max(1,...byStore.map(b=>b.sum));
  const shown = S.salesStore==='all' ? monthSum : (byStore.find(b=>b.st.id===S.salesStore)?.sum||0);
  return `
  ${statusBanner()}
  <div class="monthnav">
    <button class="iconbtn" data-mon="-1" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="m">${y}年${m}月</div>
    <button class="iconbtn" data-mon="1" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
  <div class="chips" role="group" aria-label="店舗で絞り込み">
    <button class="chip" data-sstore="all" aria-pressed="${S.salesStore==='all'}">全店</button>
    ${S.stores.map(st=>`<button class="chip" data-sstore="${st.id}" aria-pressed="${S.salesStore===st.id}">${esc(st.name)}</button>`).join('')}
  </div>
  <div class="summary" style="margin-top:12px">
    <div class="lab">${S.salesStore==='all'?'今月の3店舗合計':esc(storeName(S.salesStore))+' 今月の合計'}</div>
    <div class="big num">${yen(shown)}</div>
    <div class="bars">
      ${byStore.map(b=>`<div class="bar"><div class="row"><span>${esc(b.st.name)}</span><span class="num">${yen(b.sum)}　${b.cust}名</span></div><div class="track"><div class="fill" style="width:${(b.sum/max*100).toFixed(1)}%"></div></div></div>`).join('')}
    </div>
  </div>

  const unit = s.customers ? Math.round(s.total / s.customers) : 0;
  return `<article class="card">
    <div class="sale-top"><div><div class="sale-date">${jpDate(s.date)}</div></div><span class="tag gold">${esc(storeName(s.storeId))}</span></div>
    <div class="sale-total num">${yen(s.total)}</div>
    <div class="kv num">
      <div>技術<b>${s.tech!=null?yen(s.tech):(s.total!=null?yen((s.total||0)-(s.retail||0)):'-')}</b></div><div>店販<b>${s.retail?yen(s.retail):'-'}</b></div>
      ${s.esthe?`<div>エステ<b>${yen(s.esthe)}</b></div>`:''}
      <div>客数<b>${s.customers??'-'}${s.newCustomers?`<small style="font-weight:500;color:var(--muted)">（新規${s.newCustomers}）</small>`:''}</b></div><div>客単価<b>${unit?yen(unit):'-'}</b></div>

function noticeCard(n){
  const readers = S.reads.filter(r=>r.noticeId===n.id).length;
  return `<button class="notice ${isRead(n)?'':'unread'}" data-notice="${esc(n.id)}">
    <div class="meta">${n.pinned?'<span class="tag gold">📌 固定</span>':''}<span class="tag">${esc(storeName(n.scope))}</span><span>${n.createdAt?ago(n.createdAt):''}</span></div>
    <div class="t">${esc(n.title)}</div>
    ${(n.mentions||[]).length?`<div class="meta" style="flex-wrap:wrap;gap:4px;margin-bottom:4px">${n.mentions.map(m=>`<span class="tag ${isMeTag(m)?'me':'gold'}">@${esc(m)}</span>`).join('')}</div>`:''}
    <div class="b">${esc(n.body)}</div>
    <div class="foot">${avatarOf(n.authorId)?`<img src="${esc(avatarOf(n.authorId))}" alt="" style="width:20px;height:20px;border-radius:50%">`:''}${esc(nameOf(n.authorId))}<span style="margin-left:auto">既読 ${readers}</span></div>

}

function viewNotices(){
  const f = S.noticeFilter;
  let list = S.notices.slice();
  if (f==='unread') list = list.filter(n=>!isRead(n));
  else if (f==='me') list = list.filter(mentionsMe);
  else if (f!=='all') list = list.filter(n=>n.scope===f || n.scope==='all');
  list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.createdAt||0)-(a.createdAt||0));
  return `
  ${statusBanner()}
  <div class="chips" role="group" aria-label="絞り込み" style="margin-top:14px">
    <button class="chip" data-nf="all" aria-pressed="${f==='all'}">すべて</button>
    <button class="chip" data-nf="unread" aria-pressed="${f==='unread'}">未読 ${unreadCount()||''}</button>
    <button class="chip" data-nf="me" aria-pressed="${f==='me'}">自分宛て ${unreadMentions()||''}</button>
    ${S.stores.map(st=>`<button class="chip" data-nf="${st.id}" aria-pressed="${f===st.id}">${esc(st.name)}</button>`).join('')}
  </div>
  <div style="margin-top:12px">

}

function evRow(e){
  const t = e.allDay ? '終日' : `${e.start||''}${e.end?'–'+e.end:''}`;
  return `<div class="ev"><span class="bar2 k-${e.kind||'other'}"></span>
    <div class="time">${S.view==='calendar'?'':jpDate(e.date)+'<br>'}${esc(t)}</div>
    <div><div class="t">${esc(e.title)}</div><div class="meta"><span class="tag">${esc(storeName(e.storeId))}</span><span>${KINDS[e.kind]||''}</span></div>${e.memo?`<div class="memo" style="font-size:13px;color:var(--muted);margin-top:4px">${esc(e.memo)}</div>`:''}</div>
    ${e.authorId===S.me.id?`<button class="act danger x" data-delev="${esc(e.id)}" aria-label="予定を削除">削除</button>`:''}
  </div>`;
}

function viewCalendar(){
  const [y,m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  const trimmed = cells[35].getMonth()!==m-1 ? cells.slice(0,35) : cells;
  const evs = S.events;
  const dayEvents = evs.filter(e=>e.date===S.calSel).sort((a,b)=>(a.allDay?-1:0)-(b.allDay?-1:0) || (a.start||'').localeCompare(b.start||''));
  return `
  ${statusBanner()}
  <div class="monthnav">
    <button class="iconbtn" data-cmon="-1" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="m">${y}年${m}月</div>
    <button class="iconbtn" data-cmon="1" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
  <div class="cal">
    <div class="wk">${WD.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="grid" role="grid">
      ${trimmed.map(d=>{ const k=ymd(d); const es=evs.filter(e=>e.date===k).slice(0,3);
        return `<button class="day ${d.getMonth()!==m-1?'out':''} ${k===today?'today':''}" data-day="${k}" aria-selected="${k===S.calSel}" aria-label="${jpDate(k)}"><span class="d">${d.getDate()}</span><span class="dots">${es.map(e=>`<i class="k-${e.kind||'other'}"></i>`).join('')}</span></button>`; }).join('')}
    </div>
  </div>
  <div class="chips" style="margin-top:10px;font-size:12px;color:var(--muted);gap:12px">
    ${Object.entries(KINDS).map(([k,v])=>`<span style="flex:none;display:flex;align-items:center;gap:5px"><i class="k-${k}" style="width:8px;height:8px;border-radius:50%;display:inline-block"></i>${v}</span>`).join('')}
  </div>
  <h2 class="sec">${jpDate(S.calSel)}</h2>
  ${dayEvents.length ? dayEvents.map(evRow).join('') : `<div class="empty">この日の予定はありません。${S.me.canWrite&&db?'<br><button class="btn sm" data-act="newev">予定を追加</button>':''}</div>`}
  `;
}

  v.querySelectorAll('[data-go2]').forEach(b=>b.onclick=()=>go(b.dataset.go2));
  v.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{ S.salesMonth=shiftMonth(S.salesMonth,+b.dataset.mon); render(); });
  v.querySelectorAll('[data-cmon]').forEach(b=>b.onclick=()=>{ S.calMonth=shiftMonth(S.calMonth,+b.dataset.cmon); S.calSel=S.calMonth+'-01'; if(S.calMonth===today.slice(0,7)) S.calSel=today; render(); });
  v.querySelectorAll('[data-munit]').forEach(b=>b.onclick=()=>{ S.mUnit=b.dataset.munit; render(); });
  v.querySelectorAll('[data-editm]').forEach(b=>b.onclick=()=>openMonthlyForm(S.monthly.find(x=>x.id===b.dataset.editm)));
  v.querySelectorAll('[data-openm]').forEach(b=>b.onclick=()=>openMonthlyDetail(b.dataset.openm));
  v.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>confirmDel('この月報を削除しますか？',()=>db.doc('mreports/'+b.dataset.delm).delete(),'削除しました'));
  v.querySelectorAll('[data-sstore]').forEach(b=>b.onclick=()=>{ S.salesStore=b.dataset.sstore; render(); });
  v.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>{ S.noticeFilter=b.dataset.nf; render(); });
  v.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{ S.album=b.dataset.album; render(); });
  v.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>openPhoto(b.dataset.photo));
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ S.calSel=b.dataset.day; render(); });
  v.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>openNotice(b.dataset.notice));
  v.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));
  v.querySelectorAll('[data-editsale]').forEach(b=>b.onclick=()=>openSalesForm(S.sales.find(s=>s.id===b.dataset.editsale)));
  v.querySelectorAll('[data-delsale]').forEach(b=>b.onclick=()=>confirmDel('この売上報告を削除しますか？',()=>db.doc('sales/'+b.dataset.delsale).delete(),'削除しました'));
  v.querySelectorAll('[data-delev]').forEach(b=>b.onclick=()=>confirmDel('この予定を削除しますか？',()=>db.doc('events/'+b.dataset.delev).delete(),'削除しました'));
  const act = v.querySelectorAll('[data-act]');
  act.forEach(b=>b.onclick=()=>({newsale:openSalesForm, newmonthly:()=>openMonthlyForm(), newev:()=>openEventForm(S.calSel), saveprofile:saveProfile, savestores:saveStores, savestaff:saveStaff})[b.dataset.act]());
}
const shiftMonth = (ym,d) => { const [y,m]=ym.split('-').map(Number); const t=new Date(y,m-1+d,1); return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; };

function confirmDel(msg, fn, done){
  openSheet(`<h3>${esc(msg)}</h3><div class="row2"><button class="btn ghost" id="cNo">やめる</button><button class="btn" id="cYes" style="background:var(--danger);color:#fff">削除する</button></div>`, sh=>{
    sh.querySelector('#cNo').onclick=closeSheet;
    sh.querySelector('#cYes').onclick=async()=>{ try{ await fn(); closeSheet(); toast(done);}catch(e){ toast('削除できませんでした'); } };
  });
}


function parseLine(text){
  const out = {};
  const toNum = (s, man) => { let n = parseFloat(String(s).replace(/[,，円¥￥\s]/g,'')); if (isNaN(n)) return undefined; return Math.round(man ? n*10000 : n); };
  for (const raw of text.split(/\n/)){
    const line = raw.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    const num = line.match(/([\d][\d,，.]*)\s*(万)?/);
    if (!num) continue;
    if (/店販|物販/.test(line)) { out.retail ??= toNum(num[1], num[2]); continue; }
    if (/エステ/.test(line)) { out.esthe ??= toNum(num[1], num[2]); continue; }
    if (/技術/.test(line)) { out.tech ??= toNum(num[1], num[2]); continue; }
    let hit = false;
    if (/客数|来店|人数|総客/.test(line)) { const m=line.match(/(?:客数|来店数?|人数|総客数?)[^\d]*(\d+)/); if(m){ out.customers ??= +m[1]; hit=true; } }
    if (/新規/.test(line)) { const m=line.match(/新規[^\d]*(\d+)/); if(m){ out.newCustomers ??= +m[1]; hit=true; } }
    if (hit) continue;
    if (/売上|売り上げ|総売|合計/.test(line) && !/技術/.test(line)) {
      const m = line.match(/(?:総売上|売上合計|売り上げ|売上|合計)[^\d]*([\d][\d,，.]*)\s*(万)?/);
      if (m && out.total===undefined) out.total = toNum(m[1], m[2]);
    }
  }
  if (out.tech===undefined && out.total!==undefined) out.tech = out.total - (out.retail||0) - (out.esthe||0);
  return out;
}

    <div class="sumline"><span>その日の売上（自動計算）</span><strong class="num" id="sSum">¥0</strong></div>

      <label class="f"><span>客数</span><input class="in num" inputmode="numeric" id="sCust" value="${e?.customers??''}"></label>

    </div>

    <button class="btn" id="sSave">${e?'更新する':'報告する'}</button>
  `, sh=>{
    const numv = id => { const v = sh.querySelector(id).value.replace(/[,，円¥\s]/g,''); return v===''?null:Math.round(+v); };
    const hasEsthe = () => ESTHE_STORES.includes(String(storeName(e ? e.storeId : sh.querySelector('#sStore').value)).toLowerCase());
    const upd = () => {
      sh.querySelector('#estheRow').style.display = hasEsthe() ? '' : 'none';
      sh.querySelector('#sSum').textContent = yen((numv('#sTech')||0)+(numv('#sRetail')||0)+(hasEsthe()?(numv('#sEsthe')||0):0));
    };
    sh.querySelector('#sTech').oninput = upd; sh.querySelector('#sRetail').oninput = upd; sh.querySelector('#sEsthe').oninput = upd; sh.querySelector('#sStore').onchange = upd; upd();
    const pb = sh.querySelector('#parseBtn');
    if (pb) pb.onclick = () => {
      const r = parseLine(sh.querySelector('#lineText').value);
      const map = {tech:'#sTech', retail:'#sRetail', esthe:'#sEsthe', customers:'#sCust', newCustomers:'#sNew'};

      const memo = sh.querySelector('#lineText').value.trim();
      if (!sh.querySelector('#sMemo').value) sh.querySelector('#sMemo').value = memo;
      toast(n?`${n}項目を読み取りました。数字を確認してください`:'数字が見つかりませんでした。手入力してください');
    };
    sh.querySelector('#sSave').onclick = async () => {
      const num = id => { const v = sh.querySelector(id).value.replace(/[,，円¥\s]/g,''); return v===''?null:Math.round(+v); };
      const tech = num('#sTech'), retail = num('#sRetail'), esthe = hasEsthe() ? num('#sEsthe') : null;
      if ((tech===null && retail===null && esthe===null) || isNaN(tech??0) || isNaN(retail??0) || isNaN(esthe??0)) { toast('売上を入力してください'); return; }
      const total = (tech||0) + (retail||0) + (esthe||0);
      const date = e ? e.date : sh.querySelector('#sDate').value;
      const storeId = e ? e.storeId : sh.querySelector('#sStore').value;
      const id = `${date}_${storeId}`;
      const prev = S.sales.find(s=>s.id===id);
      { const b0 = sh.querySelector('#sSave'); if (!e && prev && !b0.dataset.ok) { b0.dataset.ok='1'; b0.textContent='すでに報告があります。もう一度押すと上書き'; return; } }
      const body = { date, storeId, total, tech: tech||0, retail: retail||0, esthe: esthe||0, customers:num('#sCust'), newCustomers:num('#sNew'),
        memo: sh.querySelector('#sMemo').value.trim(), authorId:S.me.id, createdAt: prev?.createdAt || Date.now(), updatedAt: Date.now(), likes: prev?.likes || [] };
      const btn = sh.querySelector('#sSave'); btn.disabled = true;
      try { await db.doc('sales/'+id).set(body); closeSheet(); toast(e?'更新しました':'報告しました');
        const mb = S.members[S.me.id]; if (mb && mb.storeId !== storeId) { try { await db.doc('members/'+S.me.id).update({storeId}); } catch(_){} } }
      catch(err){ btn.disabled=false; toast(err?.code==='invalid_argument'?'投稿の権限がありません':'送信できませんでした。もう一度お試しください'); }
    };
  });
}

async function toggleLike(id){
  if (!db || !S.me.id) return;
  const s = S.sales.find(x=>x.id===id); if(!s) return;
  const likes = (s.likes||[]).slice();
  const i = likes.indexOf(S.me.id); i>=0 ? likes.splice(i,1) : likes.push(S.me.id);
  try { await db.doc('sales/'+id).update({likes}); } catch(e){ toast('反応を送れませんでした'); }
}

function loadImg(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{res(i);}; i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));}; i.src=u; });
}
function drawJpeg(img, maxEdge, q){
  const s = Math.min(1, maxEdge/Math.max(img.naturalWidth,img.naturalHeight));
  const w = Math.max(1,Math.round(img.naturalWidth*s)), hh = Math.max(1,Math.round(img.naturalHeight*s));
  const c = document.createElement('canvas'); c.width=w; c.height=hh;
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,hh); x.drawImage(img,0,0,w,hh);
  return {data:c.toDataURL('image/jpeg',q), w, h:hh};
}
function compress(img){
  const LIMIT = 235000;
  for (const edge of [1800,1500,1280,1080,900,720]) for (const q of [0.85,0.75,0.65]) {
    const r = drawJpeg(img, edge, q); if (r.data.length <= LIMIT) return r;
  }
  return drawJpeg(img, 600, 0.6);
}

function dataUrlToBlob(src){ const bin = atob(src.split(',')[1]); const buf = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i); return new Blob([buf],{type:'image/jpeg'}); }
function loadSrc(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function composeBA(bSrc, aSrc){
  const [b,a] = await Promise.all([loadSrc(bSrc), loadSrc(aSrc)]);
  const H = Math.min(1600, Math.max(b.naturalHeight, a.naturalHeight));
  const wb = Math.round(b.naturalWidth*H/b.naturalHeight), wa = Math.round(a.naturalWidth*H/a.naturalHeight), gap = Math.round(H*0.012);
  const c = document.createElement('canvas'); c.width = wb+wa+gap; c.height = H;
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,H);
  x.drawImage(b,0,0,wb,H); x.drawImage(a,wb+gap,0,wa,H);
  const fs = Math.round(H*0.045); x.font = `700 ${fs}px "Zen Kaku Gothic New", sans-serif`; x.textBaseline='top';
  const tag = (t,px)=>{ const w = x.measureText(t).width + fs; x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(px, fs*0.6, w, fs*1.5); x.fillStyle='#fff'; x.fillText(t, px+fs/2, fs*0.85); };
  tag('Before', fs*0.6); tag('After', wb+gap+fs*0.6);
  return c.toDataURL('image/jpeg', 0.9);
}

function thumbFit(img, limit){
  for (const e of [360,300,240,200,160]) for (const q of [0.7,0.6,0.5]) { const r = drawJpeg(img, e, q); if (r.data.length <= limit) return r; }
  return drawJpeg(img, 140, 0.5);
}

const PASS = () => { try { return localStorage.getItem('ydy_pass') || ''; } catch(e){ return ''; } };
function API(action, payload){
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(err => { const m = String(err && err.message || err); rej({code: m.includes('PASSCODE') ? 'PASS' : 'unavailable', message:m}); })
      .api(PASS(), action, payload || {});
  });
}
function makeStore(){
  const cache = {}, vers = {}, subs = {};
  let inflight = null, again = false;
  const mk = d => ({id:d.id, exists:true, data:()=>d.data, metadata:{fromCache:false, hasPendingWrites:false}});
  const emit = c => (subs[c]||[]).forEach(fn => fn());
  async function refresh(){
    if (inflight) { again = true; return inflight; }
    const cols = Object.keys(subs).filter(c => (subs[c]||[]).length);
    if (!cols.length) return;
    inflight = API('list', {cols, vers}).then(r => {
      S.offline = false;
      for (const c in r.cols) { cache[c] = r.cols[c]; vers[c] = r.vers[c]; emit(c); }
    }).catch(e => { if (e.code === 'PASS') askPass(true); else { S.offline = true; soon(); } })
      .finally(() => { inflight = null; if (again) { again = false; refresh(); } });
    return inflight;
  }
  setInterval(() => { if (!document.hidden) refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  const local = (col, id, fn) => { const arr = cache[col] || (cache[col] = []); const i = arr.findIndex(d => d.id === id); fn(arr, i); emit(col); };
  const after = col => { vers[col] = ''; refresh(); };
  function query(col, o = {}){
    return {
      orderBy: (f, d = 'asc') => query(col, {...o, f, d}),
      limit: n => query(col, {...o, n}),
      onSnapshot(next){
        const fn = () => {
          let arr = (cache[col] || []).map(mk);
          if (o.f) arr.sort((a, b) => { const x = a.data()[o.f], y = b.data()[o.f]; return (x > y ? 1 : x < y ? -1 : 0) * (o.d === 'desc' ? -1 : 1); });
          if (o.n) arr = arr.slice(0, o.n);
          next({docs:arr, size:arr.length, empty:!arr.length, metadata:{fromCache:false}});
        };
        (subs[col] || (subs[col] = [])).push(fn);
        if (cache[col]) fn(); else refresh();
        return () => { subs[col] = subs[col].filter(x => x !== fn); };
      }
    };
  }
  function doc(path){
    const [col, id] = path.split('/');
    return {
      id, path,
      async get(){
        if (col === 'photoFull') { const r = await API('getImage', {id}); return {exists:!!r, data:() => r ? {data:r} : undefined}; }
        await refresh(); const d = (cache[col] || []).find(x => x.id === id);
        return d ? mk(d) : {exists:false, data:() => undefined};
      },
      async set(obj){
        if (col !== 'photoFull') local(col, id, (a, i) => { const d = {id, data:{...obj}}; i >= 0 ? a[i] = d : a.push(d); });
        await API('set', {col, id, obj}); if (col !== 'photoFull') after(col);
      },
      async update(obj){
        local(col, id, (a, i) => { if (i >= 0) a[i] = {id, data:{...a[i].data, ...obj}}; });
        await API('update', {col, id, obj}); after(col);
      },
      async delete(){
        if (col !== 'photoFull') local(col, id, (a, i) => { if (i >= 0) a.splice(i, 1); });
        await API('remove', {col, id}); if (col !== 'photoFull') after(col);
      },
      onSnapshot(next){
        return query(col).onSnapshot(s => { const d = s.docs.find(x => x.id === id); next(d || {exists:false, data:() => undefined, metadata:{fromCache:false}}); });
      },
      collection(){ throw new Error('not supported'); }
    };
  }
  return { doc, collection: c => query(c) };
}

async function init(){
  render();
  if (typeof google === 'undefined' || !google.script) { S.offline = true; render(); return; }
  if (!PASS()) { askPass(false); return; }
  try { await API('ping'); } catch(e){ if (e.code === 'PASS') { askPass(true); return; } S.offline = true; render(); return; }
  db = makeStore(); user = null; dl = null;
  let saved = ''; try { saved = localStorage.getItem('ydy_name') || ''; } catch(e){}
  if (saved) { S.me.id = 'u' + hashName(saved); S.me.canWrite = true; } else { S.me.canWrite = false; }
  S.me.canEdit = false;

  const err = () => {};
  let cfgLoaded = false;
  db.doc('config/app').onSnapshot(s => { const d = s.data(); S.stores = DEFAULT_STORES; if (d && Array.isArray(d.staff) && d.staff.length) S.staff = d.staff;
    if (!cfgLoaded && d) { cfgLoaded = true; if (!S.me.id) onboarding(); } soon(); }, err);
  db.collection('members').onSnapshot(s => { S.members = Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); soon(); }, err);
  db.collection('mreports').orderBy('month','desc').limit(600).onSnapshot(s => { S.monthly = toArr(s); soon(); }, err);
  db.collection('sales').orderBy('date','desc').limit(600).onSnapshot(s => { S.sales = toArr(s); S.ready = true; soon(); }, err);
  db.collection('notices').orderBy('createdAt','desc').limit(200).onSnapshot(s => { S.notices = toArr(s); soon(); }, err);
  db.collection('reads').limit(1000).onSnapshot(s => { S.reads = toArr(s); soon(); }, err);
  db.collection('events').limit(800).onSnapshot(s => { S.events = toArr(s); soon(); }, err);
  db.collection('photos').orderBy('createdAt','desc').limit(400).onSnapshot(s => { S.photos = toArr(s); soon(); }, err);
}
